apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-app
  template:
    metadata:
      labels:
        app: agent-app
    spec:
      containers:
      - name: agent-app
        image: agent-app:latest
        imagePullPolicy: Never   # swap for Always + your ECR image URI on AWS
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-app-secrets
              key: ANTHROPIC_API_KEY
        - name: CLAUDE_MODEL
          value: "claude-opus-5"
        ports:
        - containerPort: 8000
